name: build-and-validate

on:
  push:
  pull_request:

jobs:
  fabric-26x-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Python authoring dependency
        run: python3 -m pip install --user PyYAML

      - name: Compile authoring sources
        run: python3 scripts/compile_authoring_sources.py --clean

      - name: Validate data and run unit tests
        run: ./gradlew --no-daemon test validateEbbData

      - name: Run Fabric game tests
        run: ./gradlew --no-daemon runGametestServer --args nogui

      - name: Build mod jar
        run: ./gradlew --no-daemon build
