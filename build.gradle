plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        gametestServer {
            server()
            name = 'Ebb GameTest Server'
            runDir = 'run-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/gametest/TEST-ebb-gametest.xml').get().asFile.absolutePath}"
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.geckolib:geckolib-fabric-26.1.2:${geckolib_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    inputs.property 'geckolib_version', project.geckolib_version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version,
            fabric_api_version: project.fabric_api_version,
            geckolib_version: project.geckolib_version
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('compileEbbAuthoring', Exec) {
    group = 'verification'
    description = 'Compile authoring YAML/JSON examples into generated Ebb runtime datapack JSON.'
    commandLine 'python3', 'scripts/compile_authoring_sources.py', '--clean',
            '--source', 'authoring',
            '--out', layout.buildDirectory.dir('generated/ebb_authoring/data/ebb').get().asFile.absolutePath
}

tasks.named('test') {
    dependsOn 'compileEbbAuthoring'
    useJUnitPlatform()
}

tasks.register('validateEbbData') {
    group = 'verification'
    description = 'Validate Ebb bundled data and authoring-source compilation entrypoints.'
    dependsOn 'compileEbbAuthoring', 'build'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
